---
- name: Clear BGP on all devices
  arista.eos.config:
    lines:
      - no router bgp "{{ bgp_asn }}"

- name: Setup BGP on spines
  arista.eos.bgp_global:
    config:
      as_number: "{{ bgp_asn }}"
      router_id: "{{ bgp_id }}"
      maximum_paths:
        max_equal_cost_paths: 8
        max_installed_ecmp_paths: 8
      redistribute:
        - protocol: connected
      neighbor:
        - neighbor_address: LEAF
          encryption_password:
            password: admin
            type: 0
          send_community:
            community_attribute: "extended"
    state: replaced
  when: spine is defined
- name: Add Leaf peers
  arista.eos.config:
    lines:
      - neighbor interface {{ item }} peer-group LEAF remote-as {{ 65100 + idx + 1 }}
    parents:
      - router bgp {{ bgp_asn }}
  loop: "{{ fabric_interfaces }}"
  loop_control:
    index_var: idx
  when: spine is defined

- name: Setup address families on spines
  arista.eos.bgp_address_family:
    config:
      as_number: "{{ bgp_asn }}"
      address_family:
        - afi: "ipv4"
          neighbor:
            - peer: LEAF
              activate: true
        - afi: evpn
          neighbor:
            - peer: LEAF
              activate: true
  when: spine is defined
- name: Set next-hop ipv6 originate for LEAF peer group
  arista.eos.eos_config:
    lines:
      - neighbor LEAF next-hop address-family ipv6 originate
    parents:
      - router bgp {{ bgp_asn }}
      - address-family ipv4
  when: spine is defined

- name: Setup BGP on Leafs
  arista.eos.bgp_global:
    config:
      as_number: "{{ bgp_asn }}"
      router_id: "{{ bgp_id }}"
      network:
        - address: "{{ fabric_address }}"
      maximum_paths:
        max_equal_cost_paths: 8
        max_installed_ecmp_paths: 8
      neighbor:
        - neighbor_address: SPINE
          encryption_password:
            password: admin
            type: 0
          send_community:
            community_attribute: "extended"
    state: replaced
  when: spine is not defined
- name: Add spine peers
  arista.eos.config:
    lines:
      - neighbor interface {{ item }} peer-group SPINE remote-as {{ 65000 }}
    parents:
      - router bgp {{ bgp_asn }}
  loop: "{{ fabric_interfaces }}"
  when: spine is not defined
- name: Setup address families on Leafs
  arista.eos.bgp_address_family:
    config:
      as_number: "{{ bgp_asn }}"
      address_family:
        - afi: "ipv4"
          neighbor:
            - peer: SPINE
              activate: true
        - afi: evpn
          neighbor:
            - peer: SPINE
              activate: true
  when: spine is not defined
- name: Set next-hop ipv6 originate for SPINE peer group
  arista.eos.eos_config:
    lines:
      - neighbor SPINE next-hop address-family ipv6 originate
    parents:
      - router bgp {{ bgp_asn }}
      - address-family ipv4
  when: spine is not defined

- name: Setup VLANs MAC VRFs
  arista.eos.config:
    lines:
      - rd auto
      - route-target both {{ item.vlan_id }}:{{ item.vlan_id }}
      - redistribute learned
    parents:
      - router bgp {{ bgp_asn }}
      - vlan {{ item.vlan_id }}
  loop: "{{ vlans }}"
  when: spine is not defined
- name: Setup IP VRFs
  arista.eos.config:
    lines:
      - route-target import evpn {{ item.vni }}:{{ item.vni }}
      - route-target export evpn {{ item.vni }}:{{ item.vni }}
      - redistribute connected
    parents:
      - router bgp {{ bgp_asn }}
      - vrf {{ item.name }}
  loop: "{{ VRFS }}"
  when: spine is not defined
