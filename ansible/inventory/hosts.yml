---
all:
  vars:
    ansible_user: admin
    ansible_ssh_pass: admin
    ansible_become: yes
    ansible_become_method: enable
    ansible_become_password: admin
  children:
    arista_ceos:
      vars:
        ansible_network_os: arista.eos.eos
        ansible_connection: httpapi
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
      children:
        DC1SWITCHES:
          children:
            fabric_switches:
              children:
                DC1SPINES:
                  hosts:
                    DC1SPINE1: { ansible_host: 172.20.20.8 }
                    DC1SPINE2: { ansible_host: 172.20.20.9 }
                DC1LEAFS:
                  children:
                    DC1EXTERNALLEAFS:
                      hosts:
                        DC1LEAF5: { ansible_host: 172.20.20.6 }
                        DC1LEAF6: { ansible_host: 172.20.20.7 }
                  hosts:
                    DC1LEAF1: { ansible_host: 172.20.20.2 }
                    DC1LEAF2: { ansible_host: 172.20.20.3 }
                    DC1LEAF3: { ansible_host: 172.20.20.4 }
                    DC1LEAF4: { ansible_host: 172.20.20.5 }

    fortigates:
      vars:
        ansible_network_os: fortinet.fortios.fortios
        ansible_connection: httpapi
        ansible_httpapi_use_ssl: false
        ansible_httpapi_port: 80
        ansible_httpapi_validate_certs: false
      children:
        DC1FIREWALLS:
          hosts:
            DC1FW1: { ansible_host: 172.20.20.10 }
            DC1FW2: { ansible_host: 172.20.20.11 }
  hosts:
    server1:
      ansible_host: 192.168.1.101
    server2:
      ansible_host: 192.168.1.102
    switch1:
      ansible_host: 192.168.1.106
    switch2:
      ansible_host: 192.168.1.107
